services:
  postgres:
    image: postgres:16-alpine
    container_name: nse_scanner_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nse_scanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nse_scanner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
